name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  quickstart:
    name: quickstart runs end to end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: start the server, then run the quickstart against it
        run: |
          python -m uvicorn main:app &
          sleep 5
          python examples/quickstart.py

  standalone-verifier:
    name: verify_offline.py needs only cryptography
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - name: build a signed chain, then verify it with the standalone script
        run: |
          python - <<'EOF'
          import json
          from attestation import GENESIS, generate_keypair, make_entry
          priv, pub = generate_keypair()
          chain, prev = [], GENESIS
          for i in (1, 2, 3):
              e = make_entry(priv, chain_id="ci", seq=i, prev_hash=prev, run_id=f"r{i}",
                             status="passed", raw_input="{}", output={})
              chain.append(e)
              prev = e["entry_hash"]
          json.dump(chain, open("chain.json", "w"))
          open("pub.txt", "w").write(pub)
          EOF
          python verify_offline.py chain.json --public-key "$(cat pub.txt)"

  sdk-python-package:
    name: Python SDK builds, passes twine, and installs cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: build the package and check its metadata
        working-directory: sdk
        run: |
          python -m build
          python -m twine check dist/*
      - name: install the wheel into a clean environment, with the verify extra, and import it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install "$(ls sdk/dist/*.whl)[verify]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -c "import ironthread; print(ironthread.__version__); from ironthread import verify_chain; print(verify_chain([], 'x'))"

  sdk-js:
    name: JavaScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: sdk/iron-thread-js
      - name: the package contains exactly the files we mean to publish
        working-directory: sdk/iron-thread-js
        run: npm pack --dry-run

  sdk-js-end-to-end:
    name: JavaScript SDK against a real server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: start the server, then run the JavaScript client against it
        run: |
          python -m uvicorn main:app &
          sleep 5
          node sdk/iron-thread-js/integration/e2e.js
