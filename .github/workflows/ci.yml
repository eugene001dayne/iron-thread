name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  quickstart:
    name: quickstart runs end to end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: start the server, then run the quickstart against it
        run: |
          python -m uvicorn main:app &
          sleep 5
          python examples/quickstart.py

  standalone-verifier:
    name: verify_offline.py needs only cryptography
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - name: build a signed chain, then verify it with the standalone script
        run: |
          python - <<'EOF'
          import json
          from attestation import GENESIS, generate_keypair, make_entry
          priv, pub = generate_keypair()
          chain, prev = [], GENESIS
          for i in (1, 2, 3):
              e = make_entry(priv, chain_id="ci", seq=i, prev_hash=prev, run_id=f"r{i}",
                             status="passed", raw_input="{}", output={})
              chain.append(e)
              prev = e["entry_hash"]
          json.dump(chain, open("chain.json", "w"))
          open("pub.txt", "w").write(pub)
          EOF
          python verify_offline.py chain.json --public-key "$(cat pub.txt)"
